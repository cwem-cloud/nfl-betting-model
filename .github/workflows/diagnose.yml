name: diagnose

on:
  push:
    branches: ["diag/**"]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DATABASE_URL: sqlite:////tmp/diagnose.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_slate.py --sports nba
      - run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          import pandas as pd
          from pocket_capper import db
          from pocket_capper.engine import capper
          from pocket_capper.data import nba
          pd.set_option("display.width", 220)
          g, _ = db.latest_board("nba", "games"); p, _ = db.latest_board("nba", "props")
          print(g[["game_id", "kickoff", "away", "home", "dk_spread_home", "dk_total", "dk_ml_home", "consensus_total", "books"]].to_string())
          print("props rows", len(p), p["market"].value_counts().to_dict() if len(p) else {})
          inj = nba.injuries()
          r = g.iloc[0].to_dict()
          offers = capper.nba_offers(r, p)
          d = capper.nba_dossier(r, offers, inj)
          print(f"offers {len(offers)}; dossier chars {len(d)}")
          print(d[:3500])
          print(capper.system_prompt("nba")[:600])
          PY
