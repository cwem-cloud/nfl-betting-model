name: report

# Grade, run the slate, and print history + the card against the REAL database.
# Triggered by pushes to report/* branches (or manually).
on:
  push:
    branches: ["report/**"]
  workflow_dispatch:

concurrency:
  group: pocket-capper
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Require the real database
        run: test -n "$DATABASE_URL" || (echo "DATABASE_URL secret missing" && exit 1)
      - run: python scripts/grade.py
      - run: python scripts/void_mismatched_props.py
      - run: python scripts/rescreen_pending.py
      - name: Run the slate (only when the commit message says [slate])
        if: contains(github.event.head_commit.message, '[slate]') || github.event_name == 'workflow_dispatch'
        run: python scripts/run_slate.py --sports nfl,cfb,nba
      - run: python scripts/report.py
      - name: NBA dossiers for tonight
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          import pandas as pd
          from pocket_capper import db
          from pocket_capper.engine import capper
          from pocket_capper.data import nba
          g, _ = db.latest_board("nba", "games"); p, _ = db.latest_board("nba", "props")
          g["kick"] = pd.to_datetime(g["kickoff"], utc=True, format="ISO8601")
          now = pd.Timestamp.now(tz="UTC")
          inj = nba.injuries()
          for r in g[(g["kick"] > now) & (g["kick"] < now + pd.Timedelta(hours=8))].sort_values("kick").to_dict("records"):
              print("=" * 100)
              print(capper.nba_dossier(r, capper.nba_offers(r, p), inj))
          PY
      - run: python scripts/analyze.py
