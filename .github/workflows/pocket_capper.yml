name: Pocket Capper

# All cron times are UTC. ET = UTC-4 during the season (UTC-5 after early November).
on:
  schedule:
    - cron: "15 14 * * 1,4,5,6,0"   # full slate 10:15 ET Mon, Thu-Sun
    - cron: "45 15 * * 0"           # Sunday re-run 11:45 ET, after inactives
    - cron: "0 1,4,13,17,20,23 * * 4,5,6,0,1"   # odds/splits snapshots for line movement
    - cron: "0 12 * * 2"            # Tuesday grading sweep
  workflow_dispatch:
    inputs:
      task:
        description: "slate | snapshot | grade | tune-cfb | backtest-cfb"
        default: slate

concurrency:
  group: pocket-capper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-
      - run: pip install -r requirements.txt
      - name: Decide task
        id: task
        run: |
          T="${{ github.event.inputs.task }}"
          if [ -z "$T" ]; then
            case "${{ github.event.schedule }}" in
              "0 1,4,13,17,20,23 * * 4,5,6,0,1") T=snapshot ;;
              "0 12 * * 2") T=grade ;;
              *) T=slate ;;
            esac
          fi
          echo "task=$T" >> "$GITHUB_OUTPUT"
      - if: steps.task.outputs.task == 'slate'
        run: python scripts/run_slate.py
      - if: steps.task.outputs.task == 'snapshot'
        run: python scripts/snapshot_odds.py
      - if: steps.task.outputs.task == 'grade'
        run: python scripts/grade.py
      - if: steps.task.outputs.task == 'backtest-cfb'
        run: python scripts/backtest.py --cfb --seasons 2023,2024,2025
      - if: steps.task.outputs.task == 'tune-cfb'
        run: python scripts/backtest.py --cfb --tune --seasons 2024,2025
      - name: Commit history (SQLite mode only)
        if: env.DATABASE_URL == '' && contains(fromJSON('["slate","snapshot","grade"]'), steps.task.outputs.task)
        run: |
          git config user.name "pocket-capper-bot"
          git config user.email "pocket-capper-bot@users.noreply.github.com"
          git add -f data/pocket_capper.db
          git diff --cached --quiet || git commit -m "Pocket Capper ${{ steps.task.outputs.task }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
