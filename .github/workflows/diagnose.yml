name: diagnose

# Live integration probe against the real APIs, using a throwaway DB (nothing is committed).
# Runs on pushes to diag/* branches, or manually from the Actions tab.
on:
  push:
    branches: ["diag/**", "claude/live-diagnostics"]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Diagnose live integrations (throwaway DB, nothing committed)
        env:
          DATABASE_URL: sqlite:////tmp/diagnose.db
        run: |
          python scripts/diagnose.py
          python scripts/run_slate.py
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from pocket_capper import db
          for sport in ("nfl", "cfb"):
              for kind in ("games", "props", "attd"):
                  b, _ = db.latest_board(sport, kind)
                  print(f"--- {sport} {kind}: {len(b)} rows")
                  if len(b):
                      cols = [c for c in ("away", "home", "fair_spread_home", "dk_spread_home", "sharp_spread_home", "fair_total", "dk_total", "dk_open_spread_home", "spread_bets_home", "spread_money_home", "notes", "best_play", "player", "stat", "side", "line", "price", "projection", "model_prob", "market_prob", "ev", "qualifies") if c in b]
                      print(b[cols].head(25).to_string())
          p = db.read(db.picks)
          print("PICKS", len(p))
          if len(p):
              print(p[["sport", "category", "selection", "price", "units", "ev", "model_prob", "market_prob"]].to_string())
              print(p["rationale"].iloc[0])
          PY
